<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cortex Reels • عملي التشريح المرضي الخاص</title>
<style>
  :root {
    --bg: #050507;
    --card: rgba(18, 18, 24, 0.72);
    --border: rgba(255, 255, 255, 0.14);
    --gold: #f5c542;
    --gold-soft: rgba(245, 197, 66, 0.18);
    --ig1: #f09433;
    --ig2: #dc2743;
    --ig3: #bc1888;
    --ok: #22c55e;
    --bad: #ef4444;
    --text: #f8fafc;
    --muted: #cbd5e1;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    width: 100%;
    background: #000;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* إطار يحاكي شاشة الهاتف على الديسكتوب وملء الشاشة على الموبايل */
  .app-shell {
    position: relative;
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 0 60px rgba(245, 197, 66, 0.12);
  }

  /* الشريط العلوي */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    padding: 10px 14px 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.88), rgba(0,0,0,0.35), transparent);
    pointer-events: none;
  }

  .progress-track {
    width: 100%;
    height: 3.5px;
    background: rgba(255,255,255,0.2);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--ig2), var(--ig3));
    transition: width 0.35s cubic-bezier(.22,1,.36,1);
    border-radius: 99px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    pointer-events: auto;
  }

  .brand-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.2px;
  }

  .brand-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 99px;
    background: linear-gradient(135deg, var(--gold), #d97706);
    color: #000;
    font-weight: 900;
  }

  .stats-pills {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 99px;
    background: rgba(15, 15, 22, 0.72);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    cursor: pointer;
    color: var(--text);
  }

  .pill.filter-btn {
    border-color: rgba(245, 197, 66, 0.45);
    color: var(--gold);
  }

  /* حاوية السكرول العمودي (Instagram Reels Feed) */
  .reels-feed {
    height: 100%;
    width: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }

  .reels-feed::-webkit-scrollbar {
    display: none;
  }

  .reel-slide {
    position: relative;
    height: 100dvh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 74px 14px 86px 64px; /* مساحة للشريط الجانبي على اليسار */
    overflow: hidden;
  }

  /* الخلفيات المتدرجة المتحركة لكل شريحة */
  .reel-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.95;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(65px);
    opacity: 0.34;
    animation: floatOrb 9s ease-in-out infinite alternate;
    pointer-events: none;
  }

  .orb.o1 { width: 240px; height: 240px; top: -40px; right: -40px; }
  .orb.o2 { width: 220px; height: 220px; bottom: 40px; left: -60px; animation-delay: -4s; }

  @keyframes floatOrb {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(18px, -24px) scale(1.12); }
  }

  /* بطاقة السؤال الزجاجية */
  .q-card {
    position: relative;
    z-index: 5;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 22px;
    padding: 15px 14px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.48);
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: calc(100dvh - 168px);
    overflow-y: auto;
    scrollbar-width: none;
  }

  .q-card::-webkit-scrollbar { display: none; }

  .q-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
  }

  .session-chip {
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 99px;
    background: var(--gold-soft);
    color: var(--gold);
    border: 1px solid rgba(245, 197, 66, 0.35);
  }

  .q-counter {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    background: rgba(255,255,255,0.08);
    padding: 3px 8px;
    border-radius: 99px;
  }

  .q-text {
    font-size: 16.5px;
    font-weight: 800;
    line-height: 1.5;
    color: #fff;
  }

  .except-tag {
    display: inline-block;
    background: linear-gradient(135deg, #ef4444, #be123c);
    color: #fff;
    padding: 1px 8px;
    border-radius: 8px;
    font-size: 14px;
    margin-right: 4px;
    box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .opt-btn {
    width: 100%;
    text-align: right;
    background: rgba(255, 255, 255, 0.06);
    border: 1.2px solid rgba(255, 255, 255, 0.14);
    color: #f8fafc;
    border-radius: 14px;
    padding: 11px 12px;
    font-size: 13.5px;
    line-height: 1.48;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    transition: transform 0.14s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .opt-btn:active { transform: scale(0.98); }

  .opt-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    margin-top: 1px;
  }

  .opt-btn.correct {
    background: rgba(34, 197, 94, 0.22);
    border-color: var(--ok);
    box-shadow: 0 0 18px rgba(34, 197, 94, 0.25);
  }
  .opt-btn.correct .opt-letter {
    background: var(--ok);
    color: #03190b;
  }

  .opt-btn.wrong {
    background: rgba(239, 68, 68, 0.22);
    border-color: var(--bad);
    animation: shake 0.36s ease;
  }
  .opt-btn.wrong .opt-letter {
    background: var(--bad);
    color: #fff;
  }

  .opt-btn.dim { opacity: 0.55; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    45% { transform: translateX(6px); }
    70% { transform: translateX(-4px); }
  }

  .feedback-box {
    display: none;
    background: rgba(0, 0, 0, 0.48);
    border-right: 3.5px solid var(--gold);
    border-radius: 12px;
    padding: 10px 11px;
    font-size: 12.6px;
    line-height: 1.55;
    color: #e2e8f0;
    animation: fadeUp 0.28s ease;
  }

  .feedback-box.show { display: block; }
  .feedback-box strong { color: var(--gold); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* الشريط الجانبي على اليسار (مطابق لتصميم انستغرام عربي) */
  .side-actions {
    position: absolute;
    left: 10px;
    bottom: 92px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }

  .action-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(15, 15, 22, 0.55);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    transition: transform 0.18s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .action-item:active .action-icon { transform: scale(0.86); }
  .action-item.active .action-icon {
    border-color: var(--gold);
    background: rgba(245, 197, 66, 0.22);
  }
  .action-item.liked .action-icon {
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.25);
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.28); }
    100% { transform: scale(1); }
  }

  .action-label {
    font-size: 10.5px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  }

  .audio-disc {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.75);
    background: linear-gradient(135deg, var(--gold), var(--ig2), var(--ig3));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    animation: spinDisc 5s linear infinite;
  }

  @keyframes spinDisc {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* أسفل الريل (الحساب والوصف وشريط الصوت) */
  .reel-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 12;
    padding: 16px 14px 14px 66px;
    background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.45), transparent);
    pointer-events: none;
  }

  .creator-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    pointer-events: auto;
  }

  .avatar-ring {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(45deg, var(--ig1), var(--ig2), var(--ig3));
    flex-shrink: 0;
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    color: var(--gold);
  }

  .creator-name {
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .verified {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #3897f0;
    color: #fff;
    font-size: 9px;
  }

  .follow-btn {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.65);
    background: transparent;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }

  .follow-btn.following {
    background: rgba(255,255,255,0.16);
    border-color: transparent;
    color: var(--gold);
  }

  .caption-line {
    font-size: 12px;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 5px;
  }

  .audio-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #cbd5e1;
    overflow: hidden;
  }

  .eq-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }

  .eq-bars span {
    width: 2.5px;
    background: var(--gold);
    border-radius: 2px;
    animation: eq 0.9s ease-in-out infinite alternate;
  }
  .eq-bars span:nth-child(2) { animation-delay: 0.25s; }
  .eq-bars span:nth-child(3) { animation-delay: 0.5s; }

  @keyframes eq {
    from { height: 3px; }
    to { height: 12px; }
  }

  /* قلب الضغط المزدوج */
  .big-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 96px;
    z-index: 40;
    pointer-events: none;
    filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.8));
    opacity: 0;
  }

  .big-heart.burst {
    animation: heartBurst 0.8s cubic-bezier(.17,.89,.32,1.28) forwards;
  }

  @keyframes heartBurst {
    0% { transform: translate(-50%, -50%) scale(0.2) rotate(-12deg); opacity: 0; }
    35% { transform: translate(-50%, -50%) scale(1.18) rotate(6deg); opacity: 1; }
    65% { transform: translate(-50%, -50%) scale(0.98) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -68%) scale(1.3); opacity: 0; }
  }

  /* مؤشر السحب لأعلى في أول شريحة */
  .swipe-hint {
    position: absolute;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 16;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    background: rgba(0,0,0,0.5);
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid rgba(255,255,255,0.14);
    animation: bounceUp 1.6s infinite;
    pointer-events: none;
  }

  @keyframes bounceUp {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -6px); }
  }

  /* شريحة النتيجة النهائية */
  .summary-card {
    position: relative;
    z-index: 5;
    background: rgba(15, 15, 24, 0.86);
    border: 1px solid rgba(245, 197, 66, 0.35);
    backdrop-filter: blur(20px);
    border-radius: 26px;
    padding: 22px 18px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-left: -48px; /* توسيط كامل في شريحة النهاية */
  }

  .score-ring {
    width: 116px;
    height: 116px;
    margin: 0 auto;
    border-radius: 50%;
    background: conic-gradient(var(--gold) 0deg, rgba(255,255,255,0.12) 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .score-ring::after {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    background: #0d0d14;
  }

  .score-val {
    position: relative;
    z-index: 2;
    font-size: 24px;
    font-weight: 900;
    color: var(--gold);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .stat-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 6px;
  }

  .stat-box .num { font-size: 18px; font-weight: 900; color: #fff; }
  .stat-box .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .primary-btn {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--gold), #eab308);
    color: #000;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }

  .secondary-btn {
    width: 100%;
    padding: 11px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  /* النافذة السفلية (فلتر الجلسات أو الملاحظات الكاملة للمحضر) */
  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .bottom-sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 55;
    background: #12121a;
    border-top: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px 24px 0 0;
    padding: 12px 16px 22px;
    max-height: 76dvh;
    overflow-y: auto;
    transform: translateY(105%);
    transition: transform 0.3s cubic-bezier(.22,1,.36,1);
  }

  .bottom-sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 42px;
    height: 4px;
    background: rgba(255,255,255,0.28);
    border-radius: 99px;
    margin: 0 auto 12px;
  }

  .sheet-title {
    font-size: 15px;
    font-weight: 900;
    color: var(--gold);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .filter-chip {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 12px;
    padding: 10px 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-align: right;
    font-family: inherit;
  }

  .filter-chip.active {
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold);
  }

  .notes-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .notes-list li {
    background: rgba(255,255,255,0.06);
    border-right: 3px solid var(--gold);
    padding: 9px 11px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.55;
    color: #f1f5f9;
  }

  /* Toast إشعارات سريعة */
  .toast {
    position: absolute;
    top: 66px;
    left: 50%;
    transform: translate(-50%, -14px);
    z-index: 60;
    background: rgba(20, 20, 28, 0.94);
    border: 1px solid var(--gold);
    color: #fff;
    padding: 7px 14px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  #confettiCanvas {
    position: absolute;
    inset: 0;
    z-index: 45;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="app-shell">
  <canvas id="confettiCanvas"></canvas>

  <!-- الشريط العلوي -->
  <div class="top-hud">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="top-row">
      <div class="brand-title">
        <span>Reels</span>
        <span class="brand-badge">CORTEX</span>
      </div>
      <div class="stats-pills">
        <div class="pill" title="النقاط">🏆 <span id="scoreVal">0</span></div>
        <div class="pill" title="سلسلة الإجابات الصحيحة">🔥 <span id="streakVal">0</span></div>
        <button class="pill filter-btn" id="openFilterBtn">📂 الجلسات</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="big-heart" id="bigHeart">❤️</div>

  <!-- تغذية الريلز -->
  <main class="reels-feed" id="reelsFeed"></main>

  <!-- خلفية النافذة السفلية -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <!-- نافذة فلترة الجلسات -->
  <div class="bottom-sheet" id="filterSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <span>📂 تصفية حسب الجلسة (39 محضراً)</span>
      <span style="font-size:12px; color:#94a3b8; cursor:pointer;" onclick="closeSheets()">إغلاق ✕</span>
    </div>
    <div class="filter-grid" id="filterGrid"></div>
  </div>

  <!-- نافذة الشرح النسيجي الكامل للمحضر -->
  <div class="bottom-sheet" id="notesSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">

/* ===== محرك الصوت (Web Audio API أوفلاين بالكامل) ===== */
let audioCtx = null;
function playTone(type) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === "ok") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.start(now); osc.stop(now + 0.28);
    } else if (type === "bad") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.linearRampToValueAtTime(125, now + 0.22);
      gain.gain.setValueAtTime(0.13, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      osc.start(now); osc.stop(now + 0.26);
    } else if (type === "like") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(760, now + 0.09);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.start(now); osc.stop(now + 0.14);
    }
  } catch (e) {}
}

/* ===== Confetti خفيف وسريع ===== */
const cCanvas = document.getElementById("confettiCanvas");
const cCtx = cCanvas.getContext("2d");
let particles = [];
function resizeCanvas() {
  const shell = document.querySelector(".app-shell");
  cCanvas.width = shell.clientWidth;
  cCanvas.height = shell.clientHeight;
}
window.addEventListener("resize", resizeCanvas);

function launchConfetti(count = 40) {
  const colors = ["#f5c542", "#22c55e", "#ec4899", "#38bdf8", "#a855f7"];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: cCanvas.width / 2 + (Math.random() - 0.5) * 140,
      y: cCanvas.height * 0.45,
      vx: (Math.random() - 0.5) * 9,
      vy: -Math.random() * 10 - 3,
      size: Math.random() * 6 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vr: (Math.random() - 0.5) * 12,
      life: 1
    });
  }
  if (particles.length === count) animateConfetti();
}

function animateConfetti() {
  cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
  particles = particles.filter(p => p.life > 0.02);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.28;
    p.rot += p.vr;
    p.life -= 0.016;
    cCtx.save();
    cCtx.globalAlpha = p.life;
    cCtx.translate(p.x, p.y);
    cCtx.rotate((p.rot * Math.PI) / 180);
    cCtx.fillStyle = p.color;
    cCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    cCtx.restore();
  }
  if (particles.length > 0) requestAnimationFrame(animateConfetti);
}

/* ===== معالجة الإجابة ===== */
function handleAnswer(qid, chosenIdx, slideIdx) {
  if (answersMap[qid] !== undefined) return;
  const item = ALL_QUESTIONS.find(q => q.id === qid);
  answersMap[qid] = chosenIdx;

  const isRight = chosenIdx === item.ans;
  if (isRight) {
    score++;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    playTone("ok");
    if (streak % 3 === 0) launchConfetti(32);
  } else {
    streak = 0;
    playTone("bad");
  }

  document.getElementById("scoreVal").textContent = score;
  document.getElementById("streakVal").textContent = streak;
  paintAnswered(item, chosenIdx, true);
  updateSummary();

  if (autoScroll && slideIdx + 1 <= activeList.length) {
    setTimeout(() => {
      const next = feed.children[slideIdx + 1];
      if (next) next.scrollIntoView({ behavior: "smooth" });
    }, 1700);
  }
}

function paintAnswered(item, chosenIdx, animate) {
  const container = document.getElementById(`opts-${item.id}`);
  if (!container) return;
  const btns = container.querySelectorAll(".opt-btn");
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === item.ans) b.classList.add("correct");
    else if (i === chosenIdx) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const fb = document.getElementById(`fb-${item.id}`);
  const isRight = chosenIdx === item.ans;
  fb.innerHTML = `
    <strong>${isRight ? "✅ إجابة دقيقة! (هذا هو الاستثناء الصحيح)" : "❌ انتبه للمطب الامتحاني!"}</strong><br>
    ${item.exp}
    <div style="margin-top:6px; color:#94a3b8; font-size:11.5px;">💡 اضغط على أيقونة (🔬 المحضر) يساراً لقراءة كل الموجودات النسيجية للـ ${item.slide}.</div>
  `;
  fb.classList.add("show");
}

/* ===== التفاعلات الجانبية ===== */
function toggleLike(qid) {
  const btn = document.getElementById(`likeBtn-${qid}`);
  const cnt = document.getElementById(`likeCnt-${qid}`);
  const base = 120 + ((qid * 17) % 180);
  if (likedIds.has(qid)) {
    likedIds.delete(qid);
    btn.classList.remove("liked");
    btn.querySelector(".action-icon").textContent = "🤍";
    cnt.textContent = base;
  } else {
    likedIds.add(qid);
    btn.classList.add("liked");
    btn.querySelector(".action-icon").textContent = "❤️";
    cnt.textContent = base + 1;
    playTone("like");
  }
  localStorage.setItem("cortex_reels_likes", JSON.stringify([...likedIds]));
}

function triggerDoubleTapLike(qid) {
  const heart = document.getElementById("bigHeart");
  heart.classList.remove("burst");
  void heart.offsetWidth;
  heart.classList.add("burst");
  playTone("like");
  if (!likedIds.has(qid)) toggleLike(qid);
}

function toggleSave(qid) {
  const btn = document.getElementById(`saveBtn-${qid}`);
  if (savedIds.has(qid)) {
    savedIds.delete(qid);
    btn.classList.remove("active");
    btn.querySelector(".action-icon").textContent = "📑";
    btn.querySelector(".action-label").textContent = "حفظ";
    showToast("تمت الإزالة من المحفوظات");
  } else {
    savedIds.add(qid);
    btn.classList.add("active");
    btn.querySelector(".action-icon").textContent = "🔖";
    btn.querySelector(".action-label").textContent = "محفوظ";
    playTone("like");
    showToast("⭐ حُفظ المحضر للمراجعة");
  }
  localStorage.setItem("cortex_reels_saved", JSON.stringify([...savedIds]));
}

/* ===== التلخيص وشريط التقدم ===== */
function updateSummary() {
  let correct = 0, wrong = 0;
  activeList.forEach(q => {
    if (answersMap[q.id] !== undefined) {
      if (answersMap[q.id] === q.ans) correct++;
      else wrong++;
    }
  });
  const total = activeList.length || 1;
  const pct = Math.round((correct / total) * 100);

  const ring = document.getElementById("summaryRing");
  if (!ring) return;
  ring.style.background = `conic-gradient(var(--gold) ${pct * 3.6}deg, rgba(255,255,255,0.12) 0deg)`;
  document.getElementById("summaryPct").textContent = `${pct}%`;
  document.getElementById("sumCorrect").textContent = correct;
  document.getElementById("sumWrong").textContent = wrong;
  document.getElementById("sumStreak").textContent = bestStreak;

  const head = document.getElementById("summaryHeadline");
  if (correct + wrong === 0) head.textContent = "اسحب للأعلى وابدأ التحدي! 🚀";
  else if (pct >= 90) head.textContent = "🔥 وحش التشريح المرضي! جاهز للعلامة التامة";
  else if (pct >= 70) head.textContent = "💪 أداء قوي جداً! راجع أخطاءك وتضمنها";
  else head.textContent = "📚 بداية ممتازة! استخدم زر مراجعة الأخطاء لتثبيت المحضرات";
}

function reviewMistakes() {
  const list = getFilteredList("mistakes");
  if (list.length === 0) {
    showToast("🎉 لا توجد أخطاء مسجلة حالياً!");
    return;
  }
  list.forEach(q => delete answersMap[q.id]);
  currentFilter = "mistakes";
  renderFeed(list);
  showToast(`🎯 مراجعة ${list.length} محضرات أخطأت بها`);
}

function resetQuiz() {
  answersMap = {};
  score = 0;
  streak = 0;
  bestStreak = 0;
  document.getElementById("scoreVal").textContent = 0;
  document.getElementById("streakVal").textContent = 0;
  renderFeed(getFilteredList(currentFilter === "mistakes" ? "all" : currentFilter));
  showToast("🔄 تمت إعادة الجولة بالكامل");
}

function updateProgress(slideIdx) {
  const pct = activeList.length ? Math.min(100, Math.round(((slideIdx + 1) / activeList.length) * 100)) : 0;
  document.getElementById("progressFill").style.width = `${pct}%`;
}

let confettiFiredAtEnd = false;
feed.addEventListener("scroll", () => {
  const h = feed.clientHeight || 1;
  const idx = Math.round(feed.scrollTop / h);
  updateProgress(idx);
  if (idx === activeList.length && activeList.length > 0 && !confettiFiredAtEnd) {
    confettiFiredAtEnd = true;
    launchConfetti(60);
    setTimeout(() => (confettiFiredAtEnd = false), 4000);
  }
}, { passive: true });

/* دعم أزرار الأسهم على الكمبيوتر */
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") {
    feed.scrollBy({ top: feed.clientHeight, behavior: "smooth" });
  } else if (e.key === "ArrowUp") {
    feed.scrollBy({ top: -feed.clientHeight, behavior: "smooth" });
  }
});

/* تشغيل أولي */
renderFeed(ALL_QUESTIONS);
</script>
</body>
</html>
